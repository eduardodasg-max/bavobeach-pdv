<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102d46">
<title>BravoBeach PDV - Avançado</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f6f8;color:#102d46;font-family:Arial,sans-serif}
header{background:#102d46;color:white;padding:15px;display:flex;justify-content:between;align-items:center;flex-wrap:wrap;gap:10px}
header div{flex:1}
header h1{margin:0;font-size:24px}
header p{color:#bfe9e7;margin:5px 0 0}
main{max-width:900px;margin:auto;padding:16px}
.card{background:white;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 5px rgba(0,0,0,0.05)}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}
input,select,button{width:100%;padding:12px;border-radius:8px;font-size:16px}
input,select{border:1px solid #dce7eb;background:white}
button{border:0;background:#13a89e;color:white;font-weight:bold;margin-top:12px;cursor:pointer}
button:hover{opacity:0.9}
button.secondary{background:#708492}
button.danger{background:#d9534f}
nav{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
nav button{background:#dcebea;color:#102d46;margin-top:0;white-space:nowrap}
nav button.active{background:#13a89e;color:white}
.grid-mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;margin-top:15px}
.mesa-box{background:#e2ebd5;border:2px solid #a3c683;border-radius:10px;padding:20px 10px;text-align:center;font-weight:bold;cursor:pointer;transition:all 0.2s}
.mesa-box.ocupada{background:#fcdedc;border-color:#f39c94;color:#c0392b}
.mesa-box:hover{transform:scale(1.03)}
.flex-group{display:flex;gap:10px;align-items:center}
.flex-group input,.flex-group select{margin-bottom:0}
.item-linha{display:flex;justify-content:between;align-items:center;padding:8px 0;border-bottom:1px solid #eee}
.item-linha:last-child{border-bottom:0}
.badge{background:#13a89e;color:white;padding:2px 6px;border-radius:4px;font-size:12px}
.badge.danger{background:#d9534f}
.lista-cadastros{margin-top:15px;max-height:200px;overflow-y:auto;border:1px solid #eee;border-radius:8px;padding:10px}
.cadastro-tag{display:flex;justify-content:between;align-items:center;background:#f4f7f9;padding:6px 12px;border-radius:6px;margin-bottom:6px}
.cadastro-tag button{width:auto;padding:4px 8px;margin-top:0;font-size:12px}
.popup-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.popup-content{background:white;padding:20px;border-radius:12px;max-width:450px;width:90%;max-height:90vh;overflow-y:auto}
.hidden{display:none !important}
</style>
</head>
<body>
<header>
<div>
<h1>🌊 BravoBeach</h1>
<p>PDV · Sistema de Mesas & Balcão</p>
</div>
</header>
<main>
<nav>
<button class="active" data-page="mapa">🗺️ Mapa de Mesas</button>
<button data-page="config">⚙️ Configurações</button>
</nav>

<!-- ABA MAPA DE MESAS -->
<section id="mapa">
<div class="card">
<h2>Mapa de Mesas</h2>
<div class="flex-group">
<input type="number" id="nova-mesa-num" placeholder="Nº da nova mesa" min="1" style="flex:1">
<button type="button" id="btn-add-mesa" style="width:auto;margin-top:0">Adicionar Mesa</button>
</div>
<div class="grid-mesas" id="grid-mesas"></div>
</div>
</section>

<!-- ABA CONFIGURAÇÕES -->
<section id="config" class="hidden">
<div class="card">
<h2>Segurança</h2>
<label>Senha do Sistema (Cancelamentos)</label>
<div class="flex-group">
<input type="password" id="cfg-senha" value="240325">
<button type="button" id="btn-salvar-senha" style="width:auto;margin-top:0">Alterar Senha</button>
</div>
</div>
<div class="card">
<h2>Cadastro de Garçons</h2>
<form id="form-garcom" class="flex-group">
<input type="text" id="cad-garcom-nome" placeholder="Nome do Garçom" required style="flex:1">
<button type="submit" style="width:auto;margin-top:0">Cadastrar</button>
</form>
<div class="lista-cadastros" id="lista-garcons"></div>
</div>
<div class="card">
<h2>Cadastro de Produtos</h2>
<form id="form-produto">
<label>Nome do Produto</label>
<input type="text" id="cad-prod-nome" placeholder="Ex: Água de Coco" required>
<label>Preço Unitário (R$)</label>
<input type="number" id="cad-prod-preco" step="0.01" min="0" placeholder="10.00" required>
<button type="submit">Cadastrar Produto</button>
</form>
<div class="lista-cadastros" id="lista-produtos"></div>
</div>
</section>
</main>

<!-- POPUP DETALHES DA MESA -->
<div id="popup-mesa" class="popup-overlay hidden">
<div class="popup-content">
<h2 id="popup-titulo">Mesa X</h2>
<div id="popup-status-badge"></div>
<hr>
<!-- Lançar Itens -->
<div id="bloco-lancar">
<h3>Lançar Itens</h3>
<label>Garçom</label>
<select id="lancar-garcom"></select>
<label>Produto</label>
<select id="lancar-produto"></select>
<label>Quantidade</label>
<input type="number" id="lancar-qtd" value="1" min="1">
<button type="button" id="btn-lancar-item">Adicionar Item</button>
</div>
<hr>
<!-- Consumo Atual -->
<h3>Consumo da Mesa</h3>
<div id="popup-consumo"></div>
<hr>
<!-- Fechamento -->
<div id="bloco-fechamento">
<h3>Fechar Conta</h3>
<label>Taxa de Serviço (%)</label>
<input type="number" id="fechar-taxa" value="10" min="0" max="100">
<label>Desconto (R$)</label>
<div class="flex-group">
<input type="number" id="fechar-desconto" value="0" min="0" step="0.01" style="flex:1">
<input type="text" id="fechar-motivo" placeholder="Motivo do desconto" style="flex:1">
</div>
<label>Forma de Pagamento</label>
<select id="fechar-pagamento">
<option value="Dinheiro">Dinheiro</option>
<option value="PIX">PIX</option>
<option value="Débito">Débito</option>
<option value="Crédito">Crédito</option>
</select>
<div id="popup-totais" style="margin-top:15px; font-weight:bold; font-size:16px;"></div>
<button type="button" id="btn-fechar-mesa" style="background:#5cb85c">Confirmar e Fechar Mesa</button>
</div>
<button type="button" id="btn-cancelar-mesa" class="danger" style="margin-top:15px">Cancelar Mesa Inteira</button>
<button type="button" onclick="fecharPopup()" class="secondary" style="margin-top:10px">Voltar / Fechar Janela</button>
</div>
</div>

<script>
// Chaves do localStorage
const KEY_SISTEMA = "bravobeach_sistema_v2";

// Estado Global padronizado
let estado = {
    senha: "240325",
    garcons: [],
    produtos: [],
    mesas: [1,2,3,4,5,6], // Mesas padrão iniciais
    vendasAtivas: {}, // { mesaNum: { garcom, itens: [ {id, produto, qtd, preco} ] } }
    historicoFechados: []
};

// Carrega dados iniciais
try {
    const salvo = localStorage.getItem(KEY_SISTEMA);
    if(salvo) {
        estado = Object.assign(estado, JSON.parse(salvo));
    }
} catch(e) { console.error(e); }

let mesaAbertaAtual = null;

const dinheiro = n => Number(n).toLocaleString("pt-BR", {style: "currency", currency: "BRL"});

function salvar() {
    localStorage.setItem(KEY_SISTEMA, JSON.stringify(estado));
    render();
}

// Navegação entre abas
document.querySelectorAll("[data-page]").forEach(b => {
    b.onclick = () => {
        document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
        document.getElementById(b.dataset.page).classList.remove("hidden");
        document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        render();
    };
});

// Render Geral do Sistema
function render() {
    // 1. Render do mapa de mesas
    const grid = document.getElementById("grid-mesas");
    grid.innerHTML = "";
    estado.mesas.sort((a,b)=>a-b).forEach(m => {
        const box = document.createElement("div");
        const ocupada = !!estado.vendasAtivas[m];
        box.className = `mesa-box ${ocupada ? 'ocupada' : ''}`;
        box.innerHTML = `Mesa ${m}<br><small>${ocupada ? 'Ocupada' : 'Livre'}</small>`;
        box.onclick = () => abrirMesa(m);
        grid.appendChild(box);
    });

    // 2. Render da lista de garçons nas configs
    const lstGarcons = document.getElementById("lista-garcons");
    lstGarcons.innerHTML = estado.garcons.length ? estado.garcons.map(g => `
        <div class="cadastro-tag">
            <span>👤 ${g}</span>
            <button class="danger" onclick="removerGarcom('${g}')">Excluir</button>
        </div>
    `).join("") : "Nenhum garçom cadastrado.";

    // 3. Render da lista de produtos nas configs
    const lstProds = document.getElementById("lista-produtos");
    lstProds.innerHTML = estado.produtos.length ? estado.produtos.map(p => `
        <div class="cadastro-tag">
            <span>📦 ${p.nome} - ${dinheiro(p.preco)}</span>
            <button class="danger" onclick="removerProduto('${p.id}')">Excluir</button>
        </div>
    `).join("") : "Nenhum produto cadastrado.";

    // Atualiza selects do popup dinamicamente
    atualizarSelects();
}

function atualizarSelects() {
    const selG = document.getElementById("lancar-garcom");
    selG.innerHTML = estado.garcons.map(g => `<option value="${g}">${g}</option>`).join("") || "<option value=''>Cadastre um garçom</option>";

    const selP = document.getElementById("lancar-produto");
    selP.innerHTML = estado.produtos.map(p => `<option value="${p.id}">${p.nome} (${dinheiro(p.preco)})</option>`).join("") || "<option value=''>Cadastre um produto</option>";
}

// Controle de Configurações
document.getElementById("btn-salvar-senha").onclick = () => {
    const nSenha = document.getElementById("cfg-senha").value.trim();
    if(!nSenha) return alert("Digite uma senha válida!");
    estado.senha = nSenha;
    salvar();
    alert("Senha de cancelamento alterada com sucesso!");
};

document.getElementById("form-garcom").onsubmit = (e) => {
    e.preventDefault();
    const nome = document.getElementById("cad-garcom-nome").value.trim();
    if(!nome || estado.garcons.includes(nome)) return alert("Garçom inválido ou já existente.");
    estado.garcons.push(nome);
    document.getElementById("cad-garcom-nome").value = "";
    salvar();
};

function removerGarcom(nome) {
    estado.garcons = estado.garcons.filter(g => g !== nome);
    salvar();
}

document.getElementById("form-produto").onsubmit = (e) => {
    e.preventDefault();
    const nome = document.getElementById("cad-prod-nome").value.trim();
    const preco = parseFloat(document.getElementById("cad-prod-preco").value);
    if(!nome || isNaN(preco) || preco < 0) return alert("Dados do produto inválidos.");
    estado.produtos.push({ id: String(Date.now()), nome, preco });
    document.getElementById("cad-prod-nome").value = "";
    document.getElementById("cad-prod-preco").value = "";
    salvar();
};

function removerProduto(id) {
    estado.produtos = estado.produtos.filter(p => p.id !== id);
    salvar();
}

document.getElementById("btn-add-mesa").onclick = () => {
    const num = parseInt(document.getElementById("nova-mesa-num").value);
    if(!num || num <= 0) return alert("Digite um número de mesa válido.");
    if(estado.mesas.includes(num)) return alert("Essa mesa já está no mapa.");
    estado.mesas.push(num);
    document.getElementById("nova-mesa-num").value = "";
    salvar();
};

// Operações do Popup da Mesa
function abrirMesa(num) {
    mesaAbertaAtual = num;
    document.getElementById("popup-titulo").textContent = `Gestão da Mesa ${num}`;
    
    // Reseta campos de fechar
    document.getElementById("fechar-desconto").value = 0;
    document.getElementById("fechar-motivo").value = "";
    document.getElementById("fechar-taxa").value = 10;

    renderPopupMesa();
    document.getElementById("popup-mesa").classList.remove("hidden");
}

function fecharPopup() {
    document.getElementById("popup-mesa").classList.add("hidden");
    mesaAbertaAtual = null;
    render();
}

function renderPopupMesa() {
    if(!mesaAbertaAtual) return;
    const conta = estado.vendasAtivas[mesaAbertaAtual];
    const badge = document.getElementById("popup-status-badge");
    const consumoDiv = document.getElementById("popup-consumo");
    
    if(!conta) {
        badge.innerHTML = `<span class="badge">LIVRE / SEM CONSUMO</span>`;
        consumoDiv.innerHTML = "Mesa não possui consumo no momento.";
        document.getElementById("popup-totais").innerHTML = "";
    } else {
        badge.innerHTML = `<span class="badge danger">OCUPADA · Garçom: ${conta.garcom}</span>`;
        
        let subtotal = 0;
        let htmlItens = "";
        
        conta.itens.forEach((it, index) => {
            const totalItem = it.qtd * it.preco;
            subtotal += totalItem;
            htmlItens += `
                <div class="item-linha">
                    <span>${it.produto} (${it.qtd}x ${dinheiro(it.preco)})</span>
                    <strong style="margin-left:auto; margin-right:15px;">${dinheiro(totalItem)}</strong>
                    <button class="danger" style="width:auto; margin-top:0; padding:4px 8px; font-size:12px;" onclick="removerItemMesa(${index})">X</button>
                </div>
            `;
        });
        
        consumoDiv.innerHTML = htmlItens || "Nenhum item lançado.";
        
        // Calcular totais ao vivo para exibição preliminar
        atualizarTotaisFechamento(subtotal);
    }
}

function atualizarTotaisFechamento(subtotal) {
    const taxaPorcentagem = parseFloat(document.getElementById("fechar-taxa").value) || 0;
    const descValor = parseFloat(document.getElementById("fechar-desconto").value) || 0;
    
    const valorTaxa = (subtotal * taxaPorcentagem) / 100;
    const totalGeral = Math.max(0, subtotal + valorTaxa - descValor);
    
    document.getElementById("popup-totais").innerHTML = `
        <div style="display:flex; justify-content:space-between; font-weight:normal; font-size:14px; margin-top:5px;">
            <span>Subtotal Consumo:</span> <span>${dinheiro(subtotal)}</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-weight:normal; font-size:14px;">
            <span>Taxa Serviço (${taxaPorcentagem}%):</span> <span>${dinheiro(valorTaxa)}</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-weight:normal; font-size:14px; color:#d9534f;">
            <span>Desconto Aplicado:</span> <span>-${dinheiro(descValor)}</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:8px; border-top:1px solid #ccc; padding-top:5px;">
            <span>TOTAL GERAL:</span> <span>${dinheiro(totalGeral)}</span>
        </div>
    `;
}

// Vincula listeners para cálculo em tempo real ao alterar campos de fechar
['fechar-taxa', 'fechar-desconto'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
        const conta = estado.vendasAtivas[mesaAbertaAtual];
        const subtotal = conta ? conta.itens.reduce((s,i) => s + (i.qtd * i.preco), 0) : 0;
        atualizarTotaisFechamento(subtotal);
    });
});

// Lançar Item na Mesa
document.getElementById("btn-lancar-item").onclick = () => {
    if(!mesaAbertaAtual) return;
    const garcomSel = document.getElementById("lancar-garcom").value;
    const prodId = document.getElementById("lancar-produto").value;
    const qtd = parseInt(document.getElementById("lancar-qtd").value) || 1;
    
    if(!garcomSel) return alert("Por favor, cadastre e selecione um garçom nas Configurações.");
    if(!prodId) return alert("Por favor, cadastre e selecione um produto nas Configurações.");
    
    const produtoObj = estado.produtos.find(p => p.id === prodId);
    if(!produtoObj) return alert("Produto não encontrado.");
    
    // Se a mesa estiver livre, abre ela automaticamente com o garçom selecionado
    if(!estado.vendasAtivas[mesaAbertaAtual]) {
        estado.vendasAtivas[mesaAbertaAtual] = {
            garcom: garcomSel,
            itens: []
        };
    }
    
    estado.vendasAtivas[mesaAbertaAtual].itens.push({
        id: String(Date.now()) + Math.random(),
        produto: produtoObj.nome,
        qtd: qtd,
        preco: produtoObj.preco
    });
    
    salvar();
    renderPopupMesa();
};

// Remover Item Individual da Mesa (Exige Senha)
function removerItemMesa(index) {
    const promptSenha = prompt("Ação Restrita! Digite a senha administrativa para cancelar o item:");
    if(promptSenha === null) return;
    if(promptSenha !== estado.senha) {
        alert("Senha incorreta! Cancelamento não autorizado.");
        return;
    }
    
    const conta = estado.vendasAtivas[mesaAbertaAtual];
    if(conta && conta.itens[index]) {
        conta.itens.splice(index, 1);
        
        // Se esvaziar todos os itens da mesa, ela pode continuar aberta ou ser resetada
        if(conta.itens.length === 0) {
            delete estado.vendasAtivas[mesaAbertaAtual];
        }
        salvar();
        renderPopupMesa();
        alert("Item cancelado com sucesso!");
    }
}

// Cancelar Mesa Inteira (Exige Senha)
document.getElementById("btn-cancelar-mesa").onclick = () => {
    if(!mesaAbertaAtual || !estado.vendasAtivas[mesaAbertaAtual]) {
        return alert("Esta mesa não possui um consumo ativo para cancelar.");
    }
    
    const promptSenha = prompt("Atenção! Você está prestes a CANCELAR TODOS os pedidos desta mesa. Digite a senha de segurança:");
    if(promptSenha === null) return;
    if(promptSenha !== estado.senha) {
        return alert("Senha incorreta! Operação cancelada.");
    }
    
    delete estado.vendasAtivas[mesaAbertaAtual];
    salvar();
    fecharPopup();
    alert(`Mesa ${mesaAbertaAtual} cancelada e liberada com sucesso.`);
};

// Fechar Conta e Liberar Mesa
document.getElementById("btn-fechar-mesa").onclick = () => {
    if(!mesaAbertaAtual) return;
    const conta = estado.vendasAtivas[mesaAbertaAtual];
    if(!conta || conta.itens.length === 0) {
        return alert("Não há itens de consumo lançados nesta mesa para realizar o fechamento.");
    }
    
    const taxaPorcentagem = parseFloat(document.getElementById("fechar-taxa").value) || 0;
    const descValor = parseFloat(document.getElementById("fechar-desconto").value) || 0;
    const motivoDesc = document.getElementById("fechar-motivo").value.trim();
    const formaPgto = document.getElementById("fechar-pagamento").value;
    
    // Exigência de motivo para desconto
    if(descValor > 0 && !motivoDesc) {
        return alert("Aviso: É obrigatório informar o motivo para concessão de desconto!");
    }
    
    const subtotal = conta.itens.reduce((s, i) => s + (i.qtd * i.preco), 0);
    const valorTaxa = (subtotal * taxaPorcentagem) / 100;
    const totalFinal = Math.max(0, subtotal + valorTaxa - descValor);
    
    // Adiciona ao histórico de fechamentos salvos
    estado.historicoFechados.push({
        id: String(Date.now()),
        mesa: mesaAbertaAtual,
        garcom: conta.garcom,
        itens: conta.itens,
        subtotal,
        taxaPorcentagem,
        valorTaxa,
        desconto: descValor,
        motivoDesconto: motivoDesc,
        totalGeral: totalFinal,
        formaPagamento: formaPgto,
        dataFechamento: new Date().toLocaleString("pt-BR")
    });
    
    // Libera a mesa para ficar disponível novamente
    delete estado.vendasAtivas[mesaAbertaAtual];
    
    salvar();
    fecharPopup();
    alert("Conta fechada com sucesso! A mesa foi liberada e retornou ao status Disponível.");
};

// Inicialização
render();
</script>
</body>
</html>
